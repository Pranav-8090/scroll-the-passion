spring.application.name=scroll-the-passion

server.port=${PORT:8085}

# Aiven MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://scrollthepassion4290-pranavpati9042-ee23.k.aivencloud.com:28912/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
