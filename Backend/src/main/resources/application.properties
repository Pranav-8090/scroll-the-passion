
spring.application.name=scroll-the-passion

server.port=${PORT:8085}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scroll_the_passion}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

app.upload.dir=${UPLOAD_DIR:uploads/reels}
